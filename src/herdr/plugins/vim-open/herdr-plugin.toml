id = "vim-open"
name = "Open in Vim"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Open selected file path / line or search selected text in Vim"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Open in Vim"
description = "Open selected file path and line number in Vim"
contexts = ["global", "workspace", "tab", "pane", "selection"]
command = ["python3", "open_vim.py", "--herdr", "open"]

[[actions]]
id = "search"
title = "Search in Vim"
description = "Search selected text in current directory using Ripgrep + FZF in Vim"
contexts = ["global", "workspace", "tab", "pane", "selection"]
command = ["python3", "open_vim.py", "--herdr", "search"]

[[link_handlers]]
id = "file-url"
title = "Open file:// URL in Vim"
pattern = "^file://"
action = "open"
